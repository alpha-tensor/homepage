<figure class="form-demo">
  <script>
  (function () {
    var demo = document.currentScript && document.currentScript.parentElement;
    if (!demo) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if ("IntersectionObserver" in window) demo.classList.add("seq-armed");
  })();
  </script>

  <div class="form-panel">
    <div class="form-panel-head">
      <span>Part 2. Information About the Beneficiary</span>
      <span class="form-panel-note">Section of a USCIS form &#183; sample data</span>
    </div>
    <p class="form-ink-note">Type or print in black ink.</p>
    <div class="form-grid">
      <div class="fgroup open">
        <button type="button" class="fgroup-head" aria-expanded="true">Attorney</button>
        <div class="fgroup-body">
          <div class="field f12">
            <label>Attorney or Accredited Representative</label>
            <div class="chkrow">
              <span class="chk-unit" data-src="g28" tabindex="0"><span class="chk on">&#10005;</span> Select this box if Form G-28 is attached</span>
            </div>
          </div>
          <div class="field f7">
            <label>Attorney Name</label>
            <div class="fbox" data-src="g28" tabindex="0">Daniel R. Reyes</div>
          </div>
          <div class="field f5">
            <label>State Bar Number</label>
            <div class="fbox" data-src="g28" tabindex="0">CA 214538</div>
          </div>
        </div>
      </div>
      <div class="form-rule"></div>
      <div class="fgroup">
        <button type="button" class="fgroup-head" aria-expanded="false">Name</button>
        <div class="fgroup-body">
          <div class="field f5">
            <label><span class="ino">1.a.</span>Family Name (Last Name)</label>
            <div class="fbox" data-src="mxbc" tabindex="0">ITANDEHUI</div>
          </div>
          <div class="field f5">
            <label><span class="ino">1.b.</span>Given Name (First Name)</label>
            <div class="fbox" data-src="mxbc" tabindex="0">LAURA</div>
          </div>
          <div class="field f2">
            <label><span class="ino">1.c.</span>Middle Initial</label>
            <div class="fbox" data-src="mxbc" tabindex="0">M</div>
          </div>
        </div>
      </div>
      <div class="form-rule"></div>
      <div class="fgroup">
        <button type="button" class="fgroup-head" aria-expanded="false">A-Number and birth</button>
        <div class="fgroup-body">
          <div class="field f12">
            <label><span class="ino">2.</span>A-Number (if any)</label>
            <div class="aboxes" data-src="anum" tabindex="0">
              <span class="a-prefix">A</span>
              <span class="abox">1</span><span class="abox">2</span><span class="abox">3</span><span class="abox">4</span><span class="abox">5</span><span class="abox">6</span><span class="abox">7</span><span class="abox">8</span><span class="abox">9</span>
            </div>
          </div>
          <div class="field f5">
            <label><span class="ino">3.</span>Date of Birth</label>
            <div class="dob-boxes">
              <span class="fbox dob-seg" data-src="mxbc" tabindex="0">03</span><span class="dob-sep">/</span><span class="fbox dob-seg" data-src="mxbc" tabindex="0">14</span><span class="dob-sep">/</span><span class="fbox dob-seg4" data-src="mxbc" tabindex="0">1992</span>
            </div>
            <div class="dob-hint">mm / dd / yyyy</div>
          </div>
          <div class="field f2">
            <label><span class="ino">4.</span>Age</label>
            <div class="fbox" data-src="mxbc" tabindex="0">34</div>
          </div>
          <div class="field f5">
            <label><span class="ino">5.</span>Country of Birth</label>
            <div class="fbox" data-src="mxbc" tabindex="0">Mexico</div>
          </div>
        </div>
      </div>
      <div class="form-rule"></div>
      <div class="fgroup">
        <button type="button" class="fgroup-head" aria-expanded="false">Address</button>
        <div class="fgroup-body">
          <div class="field f7">
            <label><span class="ino">6.a.</span>Street Number and Name</label>
            <div class="fbox" data-src="dl-her" tabindex="0">820 S Grand Ave</div>
          </div>
          <div class="field f5">
            <label><span class="ino">6.b.</span>Apt., Ste., or Flr.</label>
            <div class="chkrow chkrow--bare chkrow--units">
              <span class="chk-unit" data-src="dl-her" tabindex="0"><span class="chk on">&#10005;</span> Apt.</span>
              <span class="chk-unit"><span class="chk"></span> Ste.</span>
              <span class="chk-unit"><span class="chk"></span> Flr.</span>
              <span class="fbox apt-no" data-src="dl-her" tabindex="0">2104</span>
            </div>
          </div>
          <div class="field f5">
            <label><span class="ino">6.c.</span>City or Town</label>
            <div class="fbox" data-src="dl-her" tabindex="0">Los Angeles</div>
          </div>
          <div class="field f2">
            <label><span class="ino">6.d.</span>State</label>
            <div class="fbox" data-src="dl-her" tabindex="0">CA</div>
          </div>
          <div class="field f2">
            <label><span class="ino">6.e.</span>ZIP Code</label>
            <div class="fbox" data-src="dl-her" tabindex="0">90017</div>
          </div>
          <div class="field f3">
            <label><span class="ino">6.f.</span>Country</label>
            <div class="fbox" data-src="dl-her" tabindex="0">USA</div>
          </div>
        </div>
      </div>
    </div>
    <div class="form-foot"><span>Sample data throughout &#183; not a government form</span><span>Page 2</span></div>
  </div>

  <!-- The intro overlay: during the intro (and only then)
       a large copy of the document being read slides up
       over the form panel, the document image alone,
       holds to be identified, then fades away; only then
       does the group it feeds light and fill. The script
       fills it per document; it never takes layout space.
       Desktop only: on mobile the intro skips the overlay
       and goes straight to the highlight and the fill. -->
  <div class="demo-overlay" hidden aria-hidden="true">
    <img class="demo-overlay-img" alt="" draggable="false">
  </div>

  <div class="demo-scroller">
  <div class="demo-controls">
    <div class="demo-dots" role="group" aria-label="Choose a document"><button type="button" class="demo-dot active" data-dot="mxbc" aria-label="Show the birth certificate"></button><button type="button" class="demo-dot" data-dot="g28" aria-label="Show the G-28"></button><button type="button" class="demo-dot" data-dot="anum" aria-label="Show the notice of action"></button><button type="button" class="demo-dot" data-dot="dl-her" aria-label="Show the driver license"></button></div>
    <div class="demo-paddles">
      <button type="button" class="demo-replay" hidden>Replay</button>
      <button type="button" class="paddle paddle-prev" aria-label="Previous document" disabled><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M16.5 3.5L8 12l8.5 8.5"/></svg></button>
      <button type="button" class="paddle paddle-next" aria-label="Next document" disabled><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M7.5 3.5L16 12l-8.5 8.5"/></svg></button>
    </div>
  </div>
  <div class="demo-sources demo-rail" role="group" aria-label="Source documents">
    <button type="button" class="doc-slide active" data-doc="mxbc" aria-pressed="true">
      <img class="doc-slide-img" src="assets/doc-acta.jpg" alt="Acta de Nacimiento, Mexican birth certificate for Laura Mar&#237;a Fernanda Itandehui. Sample document." width="773" height="1000" loading="eager" decoding="async" draggable="false">
    </button>
    <button type="button" class="doc-slide" data-doc="g28" aria-pressed="false">
      <img class="doc-slide-img" src="assets/doc-g28.jpg" alt="Form G-28, notice of entry of appearance naming attorney Daniel R. Reyes. Sample document." width="773" height="1000" loading="eager" decoding="async" draggable="false">
    </button>
    <button type="button" class="doc-slide" data-doc="anum" aria-pressed="false">
      <img class="doc-slide-img" src="assets/doc-i797c.jpg" alt="Form I-797C, notice of action for the I-130 petition. Sample document." width="773" height="1000" loading="eager" decoding="async" draggable="false">
    </button>
    <button type="button" class="doc-slide doc-slide--wide" data-doc="dl-her" aria-pressed="false">
      <img class="doc-slide-img" src="assets/doc-license.jpg" alt="California driver license for Laura Mar&#237;a Fernanda Itandehui. Sample document." width="1000" height="631" loading="eager" decoding="async" draggable="false">
    </button>
  </div>
  </div>

</figure>
