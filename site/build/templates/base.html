<!DOCTYPE html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
/* Theme, the way Mistral does it: the stored preference is
   'system', 'light' or 'dark'; 'system' (and no stored
   preference) follows the operating system. Resolved before
   the stylesheet loads so there is no flash of the wrong
   theme. */
(function () {
  var pref = "system";
  try { pref = localStorage.getItem("at-theme") || "system"; } catch (e) {}
  var dark = pref === "dark" ||
    (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.dataset.themePref = pref;
})();
</script>

<script>
(function () {
  if (!("IntersectionObserver" in window)) return;
  document.documentElement.classList.add("js-reveal");
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll(".section, .form-demo, .world-model").forEach(function (el) { io.observe(el); });
})();

/* Demo provenance: hover or tap a value to light its source. */
(function () {
  var demo = document.querySelector(".form-demo");
  if (!demo) return;
  var pinned = null;
  function light(id) {
    demo.querySelectorAll(".hl").forEach(function (el) { el.classList.remove("hl"); });
    if (!id) return;
    demo.querySelectorAll('[data-doc="' + id + '"], [data-src="' + id + '"]').forEach(function (el) { el.classList.add("hl"); });
  }
  function cycling() { return demo.classList.contains("seq-running"); }
  demo.querySelectorAll("[data-src], [data-doc]").forEach(function (el) {
    var id = el.getAttribute("data-src") || el.getAttribute("data-doc");
    el.addEventListener("mouseenter", function () { if (!pinned && !cycling()) light(id); });
    el.addEventListener("mouseleave", function () { if (!pinned && !cycling()) light(null); });
    el.addEventListener("focus", function () { if (!cycling()) light(id); });
    el.addEventListener("blur", function () { if (!pinned && !cycling()) light(null); });
    el.addEventListener("click", function () {
      /* Document slides select through the carousel script;
         pinning is for values and extraction facts. */
      if (el.classList.contains("doc-slide")) return;
      if (pinned === id) { pinned = null; light(null); }
      else { pinned = id; light(id); }
    });
  });
})();

/* Mobile menu: the disc that grows from the toggle to fill the
   screen, ported from the tagline lab. The disc scale is measured
   from the toggle to the furthest viewport corner, never fixed. */
(function () {
  var header = document.querySelector(".site-header");
  var toggle = document.getElementById("menu-toggle");
  var backdrop = document.querySelector(".menu-backdrop");
  var panel = document.getElementById("mobile-nav");
  if (!header || !toggle || !backdrop || !panel) return;
  var open = false;
  function measure() {
    var r = toggle.getBoundingClientRect();
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    backdrop.style.left = cx + "px";
    backdrop.style.top = cy + "px";
    var size = backdrop.offsetWidth || r.width;
    var furthest = 0;
    [[0, 0], [window.innerWidth, 0], [0, window.innerHeight], [window.innerWidth, window.innerHeight]].forEach(function (c) {
      furthest = Math.max(furthest, Math.hypot(c[0] - cx, c[1] - cy));
    });
    backdrop.style.setProperty("--disc-scale", ((furthest * 2 / size) * 1.06).toFixed(3));
  }
  function setOpen(next) {
    open = next;
    header.setAttribute("data-open", String(open));
    toggle.setAttribute("aria-expanded", String(open));
    toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    document.documentElement.style.overflow = open ? "hidden" : "";
    var main = document.querySelector("main");
    if (main) main.inert = open;
    var footer = document.querySelector("footer");
    if (footer) footer.inert = open;
    if (open) { measure(); }
    else { backdrop.style.setProperty("--disc-scale", "1"); }
  }
  toggle.addEventListener("click", function () { setOpen(!open); });
  panel.addEventListener("click", function (e) {
    if (e.target.closest("a")) setOpen(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && open) { setOpen(false); toggle.focus(); }
  });
  window.addEventListener("resize", function () { if (open) measure(); });
})();
</script>
<script>
/* Form demo groups. On mobile the stylesheet collapses each
   group behind its head; this wires the accordion (one open
   at a time) and opens the group holding a source's values
   when that source is tapped. On desktop the heads are
   hidden and every group shows, so this changes nothing. */
(function () {
  var groups = Array.prototype.slice.call(document.querySelectorAll(".fgroup"));
  if (!groups.length) return;
  function setOpen(g, open) {
    g.classList.toggle("open", open);
    var head = g.querySelector(".fgroup-head");
    if (head) head.setAttribute("aria-expanded", String(open));
  }
  groups.forEach(function (g) {
    var head = g.querySelector(".fgroup-head");
    if (!head) return;
    head.addEventListener("click", function () {
      var willOpen = !g.classList.contains("open");
      groups.forEach(function (o) { setOpen(o, false); });
      if (willOpen) setOpen(g, true);
    });
  });
  /* Selecting a document opens its group on mobile; the
     carousel script owns that now. */
})();
</script>
<script>
/* Form demo carousel and fill cycle. One selection state
   drives everything: the slides, the dots, the extraction
   strip under the carousel, and the highlight on the form
   group the active document feeds. Clicking a slide or a
   dot selects it and scrolls it into place; scrolling the
   carousel selects whichever document settles at the start.
   When the demo scrolls into view, a cycle runs once: each
   document activates in turn and fills the values it owns
   (the filled form stays in the markup throughout), then
   the selection returns to the first document. Any touch
   cancels the cycle and hands over control. */
(function () {
  var demo = document.querySelector(".form-demo");
  if (!demo) return;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var hasIO = "IntersectionObserver" in window;

  var scroller = demo.querySelector(".demo-sources");
  var slides = Array.prototype.slice.call(demo.querySelectorAll(".doc-slide"));
  var dots = Array.prototype.slice.call(demo.querySelectorAll(".demo-dot"));
  var strips = Array.prototype.slice.call(demo.querySelectorAll(".demo-extract"));
  var prev = demo.querySelector(".paddle-prev");
  var next = demo.querySelector(".paddle-next");
  var replay = demo.querySelector(".demo-replay");
  var groups = Array.prototype.slice.call(demo.querySelectorAll(".fgroup"));
  if (!scroller || slides.length !== 4 || groups.length !== 4) return;

  var sources = slides.map(function (s) { return s.getAttribute("data-doc"); });
  var groupsFor = {
    "mxbc": [groups[1], groups[2]],
    "g28": [groups[0]],
    "anum": [groups[2]],
    "dl-her": [groups[3]]
  };
  var active = sources[0];
  var programmaticUntil = 0;
  var timers = [];
  var running = false;
  var played = false;

  slides.forEach(function (s) {
    demo.querySelectorAll('[data-src="' + s.getAttribute("data-doc") + '"]').forEach(function (el) {
      el.querySelectorAll(".abox").forEach(function (box, j) {
        box.style.setProperty("--seq-delay", (j * 45) + "ms");
      });
    });
  });

  function isMobile() {
    return window.matchMedia("(max-width: 640px)").matches;
  }
  function setOpen(group, open) {
    group.classList.toggle("open", open);
    var head = group.querySelector(".fgroup-head");
    if (head) head.setAttribute("aria-expanded", String(open));
  }
  function openOnly(group) {
    groups.forEach(function (g) { setOpen(g, g === group); });
  }
  function slideFor(id) {
    return slides[sources.indexOf(id)];
  }
  function scrollToSlide(id) {
    var s = slideFor(id);
    if (!s) return;
    programmaticUntil = Date.now() + 900;
    scroller.scrollTo({
      left: Math.max(0, s.offsetLeft - 6),
      behavior: reduced ? "auto" : "smooth"
    });
  }
  function updatePaddles() {
    var i = sources.indexOf(active);
    if (prev) prev.disabled = i <= 0;
    if (next) next.disabled = i >= sources.length - 1;
  }
  function setActive(id, opts) {
    opts = opts || {};
    active = id;
    slides.forEach(function (s) {
      var on = s.getAttribute("data-doc") === id;
      s.classList.toggle("active", on);
      s.setAttribute("aria-pressed", String(on));
    });
    dots.forEach(function (d) {
      d.classList.toggle("active", d.getAttribute("data-dot") === id);
    });
    strips.forEach(function (st) {
      st.hidden = st.getAttribute("data-doc") !== id;
    });
    groups.forEach(function (g) { g.classList.remove("sel-lit"); });
    (groupsFor[id] || []).forEach(function (g) { g.classList.add("sel-lit"); });
    if (opts.openGroup && isMobile() && groupsFor[id] && groupsFor[id][0]) {
      openOnly(groupsFor[id][0]);
    }
    if (opts.scroll) scrollToSlide(id);
    updatePaddles();
  }

  function later(fn, ms) {
    timers.push(window.setTimeout(fn, ms));
  }
  function clearTimers() {
    timers.forEach(function (t) { window.clearTimeout(t); });
    timers = [];
  }
  function light(id, on) {
    demo.querySelectorAll('[data-doc="' + id + '"], [data-src="' + id + '"]').forEach(function (el) {
      el.classList.toggle("hl", on);
    });
  }
  function finishCycle(returnToFirst) {
    if (!running && !demo.classList.contains("seq-running")) return;
    clearTimers();
    running = false;
    played = true;
    sources.forEach(function (id) {
      var s = slideFor(id);
      if (s) s.classList.add("arrived");
      demo.classList.add("filled-" + id);
      light(id, false);
      (groupsFor[id] || []).forEach(function (g) { g.classList.remove("seq-lit"); });
    });
    demo.classList.remove("seq-running");
    demo.classList.add("seq-done");
    if (returnToFirst) setActive(sources[0], { scroll: true, openGroup: true });
  }
  function playStep(id) {
    if (!running) return;
    var slide = slideFor(id);
    if (slide) slide.classList.add("arrived");
    setActive(id, { scroll: true, openGroup: true });
    var owned = groupsFor[id] || [];
    if (isMobile() && id === "mxbc") {
      later(function () { if (running) openOnly(groups[2]); }, 420);
    }
    owned.forEach(function (g) { g.classList.add("seq-lit"); });
    light(id, true);
    later(function () { demo.classList.add("filled-" + id); }, 190);
    later(function () {
      owned.forEach(function (g) { g.classList.remove("seq-lit"); });
      light(id, false);
    }, 680);
  }
  function startCycle() {
    if (reduced || !hasIO) return;
    clearTimers();
    running = true;
    played = false;
    demo.classList.add("seq-armed", "seq-running");
    demo.classList.remove("seq-done");
    demo.querySelectorAll(".hl").forEach(function (el) { el.classList.remove("hl"); });
    sources.forEach(function (id) {
      var s = slideFor(id);
      if (s) s.classList.remove("arrived");
      demo.classList.remove("filled-" + id);
      (groupsFor[id] || []).forEach(function (g) { g.classList.remove("seq-lit"); });
    });
    if (isMobile()) openOnly(groups[0]);
    programmaticUntil = Date.now() + 900;
    scroller.scrollTo({ left: 0, behavior: "smooth" });
    sources.forEach(function (id, i) {
      later(function () { playStep(id); }, i * 850);
    });
    later(function () { finishCycle(true); }, sources.length * 850 + 500);
  }
  function userTakeover() {
    if (running) finishCycle(false);
  }

  slides.forEach(function (s) {
    s.addEventListener("click", function () {
      userTakeover();
      setActive(s.getAttribute("data-doc"), { scroll: true, openGroup: true });
    });
  });
  dots.forEach(function (d) {
    d.addEventListener("click", function () {
      userTakeover();
      setActive(d.getAttribute("data-dot"), { scroll: true, openGroup: true });
    });
  });
  function stepBy(dir, focusSlide) {
    userTakeover();
    var i = sources.indexOf(active);
    var j = Math.min(sources.length - 1, Math.max(0, i + dir));
    setActive(sources[j], { scroll: true, openGroup: true });
    if (focusSlide) {
      var s = slideFor(active);
      if (s) s.focus({ preventScroll: true });
    }
  }
  if (prev) prev.addEventListener("click", function () { stepBy(-1, false); });
  if (next) next.addEventListener("click", function () { stepBy(1, false); });
  scroller.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { e.preventDefault(); stepBy(1, true); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); stepBy(-1, true); }
  });

  var scrollSettle = null;
  scroller.addEventListener("scroll", function () {
    if (Date.now() < programmaticUntil) return;
    window.clearTimeout(scrollSettle);
    scrollSettle = window.setTimeout(function () {
      var rect = scroller.getBoundingClientRect();
      var best = 0;
      var bestDiff = Infinity;
      slides.forEach(function (s, i) {
        var diff = Math.abs(s.getBoundingClientRect().left - rect.left - 6);
        if (diff < bestDiff) { bestDiff = diff; best = i; }
      });
      if (sources[best] !== active) {
        userTakeover();
        setActive(sources[best], { openGroup: true });
      }
    }, 140);
  }, { passive: true });
  scroller.addEventListener("wheel", userTakeover, { passive: true });
  scroller.addEventListener("touchstart", userTakeover, { passive: true });

  if (replay) {
    if (!reduced && hasIO) replay.hidden = false;
    replay.addEventListener("click", function () { startCycle(); });
  }

  setActive(sources[0], {});

  if (!reduced && hasIO) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting && !played && !running) {
          startCycle();
          io.unobserve(demo);
        }
      });
    }, { threshold: 0.35 });
    io.observe(demo);
  }
})();
</script>
<script>
/* Theme switch wiring. The head script already resolved the
   theme; this marks the active option, stores choices, and
   follows live system changes while the preference is
   'system'. */
(function () {
  var root = document.documentElement;
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  function resolve(pref) {
    return pref === "dark" || (pref !== "light" && mq.matches) ? "dark" : "light";
  }
  function mark() {
    var pref = root.dataset.themePref || "system";
    document.querySelectorAll(".theme-option").forEach(function (btn) {
      var active = btn.dataset.pref === pref;
      btn.dataset.active = String(active);
      btn.setAttribute("aria-pressed", String(active));
    });
  }
  document.querySelectorAll(".theme-option").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var pref = btn.dataset.pref;
      try { localStorage.setItem("at-theme", pref); } catch (e) {}
      root.dataset.themePref = pref;
      root.dataset.theme = resolve(pref);
      mark();
    });
  });
  if (mq.addEventListener) {
    mq.addEventListener("change", function () {
      if ((root.dataset.themePref || "system") === "system") {
        root.dataset.theme = resolve("system");
      }
    });
  }
  mark();
})();
</script>
</body>
