        <style>
            #boot-screen {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: grid;
                place-items: center;
                background: #f4f0e8;
                color: #101522;
            }

            .boot-card {
                width: min(90vw, 420px);
                padding: 24px 28px;
                border: 1px solid #d9d1c6;
                background: #f8f5f0;
                box-shadow: 0 18px 40px rgba(16, 21, 34, 0.12);
            }

            .boot-row {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 12px;
                font-family:
                    "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo,
                    Consolas, monospace;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }

            .boot-mark {
                width: 12px;
                height: 12px;
                background: #c75a1b;
                flex-shrink: 0;
            }

            .boot-copy {
                font-family:
                    "Inter",
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                font-size: 15px;
                line-height: 1.5;
                color: #5a6270;
            }

            .boot-line {
                height: 2px;
                width: 100%;
                margin-top: 18px;
                background: linear-gradient(
                    90deg,
                    rgba(201, 209, 198, 0.3),
                    #c75a1b,
                    rgba(201, 209, 198, 0.3)
                );
                transform-origin: left center;
                animation: bootPulse 1.4s ease-in-out infinite;
            }

            @keyframes bootPulse {
                0%,
                100% {
                    opacity: 0.55;
                    transform: scaleX(0.85);
                }

                50% {
                    opacity: 1;
                    transform: scaleX(1);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .boot-line {
                    animation: none;
                }
            }
        </style>
