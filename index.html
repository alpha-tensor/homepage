<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!--
            Privacy and consent bootstrap.

            Runs before any tag. It sets Google Consent Mode v2 to denied, reads
            the visitor's stored choice, and only injects Google Tag Manager and
            Google Analytics once analytics or marketing consent is granted. The
            React banner reads and writes consent through window.__AT_CONSENT.
            Keep the cookie inventory in src/content/legal.ts in step with this.
        -->
        <script>
            (function () {
                "use strict";

                var KEY = "at.consent.v1";
                var GTM_ID = "GTM-PFLPC88K";
                var GA_ID = "G-94HFF53B4R";
                var tagsLoaded = false;

                window.dataLayer = window.dataLayer || [];
                function gtag() {
                    window.dataLayer.push(arguments);
                }
                window.gtag = window.gtag || gtag;

                // Nothing optional is allowed until the visitor chooses. This has
                // to run before any Google tag so the signal is already in place.
                gtag("consent", "default", {
                    ad_storage: "denied",
                    ad_user_data: "denied",
                    ad_personalization: "denied",
                    analytics_storage: "denied",
                    functionality_storage: "granted",
                    security_storage: "granted",
                    wait_for_update: 500,
                });
                gtag("set", "ads_data_redaction", true);
                gtag("set", "url_passthrough", true);

                function normalize(input) {
                    return {
                        necessary: true,
                        analytics: !!(input && input.analytics),
                        marketing: !!(input && input.marketing),
                        version: 1,
                        updatedAt: new Date().toISOString(),
                    };
                }

                function read() {
                    try {
                        var raw = window.localStorage.getItem(KEY);
                        if (!raw) return null;
                        var parsed = JSON.parse(raw);
                        if (!parsed || typeof parsed !== "object") return null;
                        return parsed;
                    } catch (error) {
                        return null;
                    }
                }

                function persist(state) {
                    try {
                        window.localStorage.setItem(KEY, JSON.stringify(state));
                    } catch (error) {
                        /* storage unavailable, the choice still applies this page */
                    }
                }

                function clearAnalyticsCookies() {
                    var host = window.location.hostname;
                    var suffixes = [
                        "",
                        "; domain=" + host,
                        "; domain=." + host,
                    ];
                    document.cookie.split(";").forEach(function (entry) {
                        var name = entry.split("=")[0].trim();
                        if (!/^_g(a|id|at|cl)/.test(name)) return;
                        suffixes.forEach(function (suffix) {
                            document.cookie =
                                name +
                                "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/" +
                                suffix;
                        });
                    });
                }

                function apply(state) {
                    gtag("consent", "update", {
                        analytics_storage: state.analytics
                            ? "granted"
                            : "denied",
                        ad_storage: state.marketing ? "granted" : "denied",
                        ad_user_data: state.marketing ? "granted" : "denied",
                        ad_personalization: state.marketing
                            ? "granted"
                            : "denied",
                        functionality_storage: "granted",
                        security_storage: "granted",
                    });
                    if (!state.analytics && !state.marketing) {
                        clearAnalyticsCookies();
                    }
                }

                function injectScript(src, id) {
                    if (document.getElementById(id)) return;
                    var script = document.createElement("script");
                    script.async = true;
                    script.id = id;
                    script.src = src;
                    document.head.appendChild(script);
                }

                function loadTags(state) {
                    if (tagsLoaded) return;
                    if (!state.analytics && !state.marketing) return;
                    tagsLoaded = true;
                    gtag("js", new Date());
                    injectScript(
                        "https://www.googletagmanager.com/gtm.js?id=" + GTM_ID,
                        "at-gtm",
                    );
                    if (state.analytics) {
                        gtag("config", GA_ID);
                        injectScript(
                            "https://www.googletagmanager.com/gtag/js?id=" +
                                GA_ID,
                            "at-gtag",
                        );
                    }
                }

                window.__AT_CONSENT = {
                    read: read,
                    normalize: normalize,
                    open: function () {
                        window.dispatchEvent(
                            new CustomEvent("at:consent-open"),
                        );
                    },
                    set: function (input) {
                        var state = normalize(input);
                        persist(state);
                        apply(state);
                        loadTags(state);
                        window.dispatchEvent(
                            new CustomEvent("at:consent-change", {
                                detail: state,
                            }),
                        );
                        return state;
                    },
                };

                var stored = read();
                if (stored) {
                    var restored = normalize(stored);
                    apply(restored);
                    loadTags(restored);
                }
            })();
        </script>

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta

        <meta

        />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            #boot-screen {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: grid;
                place-items: center;
                background: #f4f0e8;
                color: #101522;
            }

            .boot-card {
                width: min(90vw, 420px);
                padding: 24px 28px;
                border: 1px solid #d9d1c6;
                background: #f8f5f0;
                box-shadow: 0 18px 40px rgba(16, 21, 34, 0.12);
            }

            .boot-row {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 12px;
                font-family:
                    "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo,
                    Consolas, monospace;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }

            .boot-mark {
                width: 12px;
                height: 12px;
                background: #c75a1b;
                flex-shrink: 0;
            }

            .boot-copy {
                font-family:
                    "Inter",
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                font-size: 15px;
                line-height: 1.5;
                color: #5a6270;
            }

            .boot-line {
                height: 2px;
                width: 100%;
                margin-top: 18px;
                background: linear-gradient(
                    90deg,
                    rgba(201, 209, 198, 0.3),
                    #c75a1b,
                    rgba(201, 209, 198, 0.3)
                );
                transform-origin: left center;
                animation: bootPulse 1.4s ease-in-out infinite;
            }

            @keyframes bootPulse {
                0%,
                100% {
                    opacity: 0.55;
                    transform: scaleX(0.85);
                }

                50% {
                    opacity: 1;
                    transform: scaleX(1);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .boot-line {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <div id="boot-screen" role="status" aria-live="polite">
            <div class="boot-card">
                <div class="boot-row">
                    <span class="boot-mark"></span>
                    <span>AlphaTensor</span>
                </div>
                <div class="boot-copy">
                    Operational automation for immigration law firms.
                </div>
                <div class="boot-line"></div>
            </div>
        </div>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
